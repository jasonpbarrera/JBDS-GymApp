name = "jbds-gymapp"
main = "worker/index.js"
compatibility_date = "2026-04-01"
workers_dev = true

[assets]
directory = "publish_output/wwwroot"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
# Point this to your OCI Always Free ASP.NET Core 10 API exposed via Cloudflare Tunnel
# Example: "https://api-gymapp.jbdigitalservices.net"
API_ORIGIN = "https://api-gymapp.jbdigitalservices.net"

# Uncomment and configure custom domain(s) / wildcard subdomain once DNS is ready:
# [[routes]]
# pattern = "gymapp.jbdigitalservices.net"
# custom_domain = true
