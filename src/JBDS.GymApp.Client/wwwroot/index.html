<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JBDS GymApp — Multi-Tenant Gym Membership &amp; Check-In PWA</title>
    <meta name="description" content="Multi-tenant, multi-product gym membership management, QR check-in, class scheduling, and billing PWA built with .NET 10 Blazor WebAssembly by JB Digital Services." />
    <meta name="author" content="Jason Barrera, JB Digital Services" />
    <meta name="creator" content="JB Digital Services" />
    <meta name="publisher" content="JB Digital Services" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="canonical" href="https://gymapp.jbdigitalservices.net/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="JBDS GymApp — Multi-Tenant Gym Membership PWA" />
    <meta property="og:description" content="Manage gym memberships, QR/barcode check-ins, class bookings, and billing across multiple gyms and products." />
    <meta property="og:url" content="https://gymapp.jbdigitalservices.net/" />
    <meta property="og:site_name" content="JBDS GymApp by JB Digital Services" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JBDS GymApp — Multi-Tenant Gym Membership PWA" />
    <meta name="twitter:description" content="Multi-tenant .NET 10 Blazor WASM + PWA gym management platform powered by JB Digital Services." />

    <base href="/" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="stylesheet" href="css/app.css" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "JBDS GymApp",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web, iOS, Android (PWA)",
      "description": "Multi-tenant gym membership management, QR check-in, class scheduling, and billing Progressive Web App.",
      "url": "https://gymapp.jbdigitalservices.net/",
      "creator": {
        "@type": "Person",
        "name": "Jason Barrera"
      },
      "provider": {
        "@type": "Organization",
        "name": "JB Digital Services",
        "url": "https://jbdigitalservices.net"
      },
      "publisher": {
        "@type": "Organization",
        "name": "JB Digital Services",
        "url": "https://jbdigitalservices.net"
      }
    }
    </script>
</head>

<body>
    <div id="app">
        <div class="boot-screen">
            <div class="boot-spinner"></div>
            <p>Loading JBDS GymApp...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unexpected error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">✕</span>
    </div>

    <script src="js/qr-scanner.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (refreshing) return;
                refreshing = true;
                window.location.reload();
            });
            navigator.serviceWorker.register('service-worker.js');
        }
    </script>
</body>

</html>
